[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-layer-graphene-structure"
version = "0.1.0"
description = "Compact device models of single-layer graphene (contacts/FETs, interconnects, photodetectors) with a verification layer"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Harsh Vardhan Gururani" }]
requires-python = ">=3.12"   # PEP 701 f-strings are used; see AUTOMATION_LOG 2026-10-07
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.10.9",
    "sympy==1.12",
    "mpmath==1.4.1",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["graphene"]
# The model and audit modules are deliberately flat top-level modules in src/
# (docs/INVENTORY.md, "Layout decision"); list them so `pip install -e .`
# makes every one importable by its existing name.
py-modules = [
    "bracketed_root",
    "contact_resistance_crossover",
    "graphene_ambipolar_mirror_audit",
    "graphene_areal_thermal_resistance",
    "graphene_attribute_default_capture",
    "graphene_band_structure",
    "graphene_band_structure_audit",
    "graphene_binding_class",
    "graphene_branch_asymmetric_mobility",
    "graphene_capture_leverage_figure",
    "graphene_capture_surface_guard",
    "graphene_capture_surface_mutation",
    "graphene_census_split_equivalence",
    "graphene_chapter_status_audit",
